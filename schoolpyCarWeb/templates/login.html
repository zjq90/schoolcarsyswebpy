<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校车管理系统 - 登录</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header .icon {
            font-size: 60px;
            color: #667eea;
            margin-bottom: 15px;
        }
        .login-header h3 {
            color: #333;
            font-weight: 600;
        }
        .login-header p {
            color: #666;
            margin-top: 10px;
        }
        .form-group {
            position: relative;
            margin-bottom: 20px;
        }
        .form-group .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }
        .form-control {
            padding-left: 45px;
            height: 50px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-login {
            width: 100%;
            height: 50px;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .alert {
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <i class="fa fa-bus icon"></i>
            <h3>校车管理系统</h3>
            <p>School Bus Management System</p>
        </div>
        
        <div id="alert-container"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <i class="fa fa-user input-icon"></i>
                <input type="text" class="form-control" id="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <i class="fa fa-lock input-icon"></i>
                <input type="password" class="form-control" id="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary btn-login" id="loginBtn">
                <i class="fa fa-sign-in"></i> 登录
            </button>
        </form>
        
        <div class="text-center mt-4">
            <small class="text-muted">
                <strong>默认账号：</strong><br>
                教育局管理员：admin / 123456<br>
                学校管理员：school1 / 123456
            </small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 全局存储token和用户信息
        window.authToken = localStorage.getItem('authToken');
        window.currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');

        // 显示提示消息
        function showAlert(message, type = 'danger') {
            const alertHtml = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="close" data-dismiss="alert">
                        <span>&times;</span>
                    </button>
                </div>
            `;
            $('#alert-container').html(alertHtml);
        }

        // 登录表单提交
        $('#loginForm').on('submit', async function(e) {
            e.preventDefault();
            
            const username = $('#username').val().trim();
            const password = $('#password').val();
            
            if (!username || !password) {
                showAlert('请输入用户名和密码');
                return;
            }
            
            const loginBtn = $('#loginBtn');
            loginBtn.prop('disabled', true).html('<i class="fa fa-spinner fa-spin"></i> 登录中...');
            
            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);
                
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    // 保存token和用户信息
                    localStorage.setItem('authToken', result.access_token);
                    localStorage.setItem('currentUser', JSON.stringify(result.user));
                    
                    window.authToken = result.access_token;
                    window.currentUser = result.user;
                    
                    showAlert('登录成功，正在跳转...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 500);
                } else {
                    showAlert(result.detail || '登录失败，请检查用户名和密码');
                }
            } catch (error) {
                console.error('登录错误:', error);
                showAlert('网络错误，请稍后重试');
            } finally {
                loginBtn.prop('disabled', false).html('<i class="fa fa-sign-in"></i> 登录');
            }
        });

        // 按回车登录
        $('#password').on('keypress', function(e) {
            if (e.which === 13) {
                $('#loginForm').submit();
            }
        });
    </script>
</body>
</html>
