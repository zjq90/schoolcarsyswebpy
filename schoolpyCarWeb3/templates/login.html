<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校车后台管理系统 - 登录</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .login-container {
            margin-top: 10%;
        }
        .login-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0;
            padding: 2rem;
        }
        .login-body {
            padding: 2rem;
        }
        .form-control {
            border-radius: 25px;
            padding: 1.5rem 1.5rem;
        }
        .btn-login {
            border-radius: 25px;
            padding: 0.75rem 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #5a6fd6 0%, #6a4190 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .input-group-text {
            background: transparent;
            border-left: none;
            border-radius: 0 25px 25px 0;
        }
        .input-group .form-control {
            border-right: none;
            border-radius: 25px 0 0 25px;
        }
    </style>
</head>
<body>
    <div class="container login-container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card login-card">
                    <div class="login-header text-center">
                        <i class="fa fa-bus fa-4x mb-3"></i>
                        <h3 class="mb-0">校车后台管理系统</h3>
                        <p class="mb-0 mt-2 opacity-8">School Bus Management System</p>
                    </div>
                    <div class="login-body">
                        <form id="loginForm">
                            <div class="form-group">
                                <label class="font-weight-bold">用户名</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="username" placeholder="请输入用户名" required>
                                    <div class="input-group-append">
                                        <span class="input-group-text"><i class="fa fa-user"></i></span>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group mt-4">
                                <label class="font-weight-bold">密码</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="password" placeholder="请输入密码" required>
                                    <div class="input-group-append">
                                        <span class="input-group-text"><i class="fa fa-lock"></i></span>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group mt-4">
                                <button type="submit" class="btn btn-primary btn-login btn-block">
                                    <i class="fa fa-sign-in mr-2"></i>登录系统
                                </button>
                            </div>
                        </form>
                        <div class="text-center mt-4 text-muted">
                            <small>默认管理员账号: admin / admin123</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let accessToken = localStorage.getItem('access_token');
        if (accessToken) {
            window.location.href = '/dashboard';
        }

        $('#loginForm').on('submit', function(e) {
            e.preventDefault();
            const username = $('#username').val();
            const password = $('#password').val();
            
            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);
            
            $.ajax({
                url: '/api/auth/login',
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: function(response) {
                    localStorage.setItem('access_token', response.access_token);
                    localStorage.setItem('username', username);
                    window.location.href = '/dashboard';
                },
                error: function(xhr) {
                    alert('登录失败：' + (xhr.responseJSON?.detail || '未知错误'));
                }
            });
        });
    </script>
</body>
</html>
