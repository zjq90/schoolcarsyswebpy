<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}校车管理系统{% endblock %}</title>
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Custom CSS -->
    <style>
        body {
            padding-top: 56px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-content {
            flex: 1;
        }
        .sidebar {
            background-color: #f8f9fa;
            min-height: calc(100vh - 56px);
        }
        .sidebar .nav-link {
            color: #495057;
            padding: 12px 20px;
        }
        .sidebar .nav-link:hover {
            background-color: #e9ecef;
            color: #007bff;
        }
        .sidebar .nav-link.active {
            background-color: #007bff;
            color: white;
        }
        .sidebar .nav-link i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }
        .card-stat {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card-stat:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .table-responsive {
            overflow-x: auto;
        }
        .badge-score-high {
            background-color: #28a745;
        }
        .badge-score-medium {
            background-color: #ffc107;
            color: #212529;
        }
        .badge-score-low {
            background-color: #dc3545;
        }
        .badge-status-normal {
            background-color: #28a745;
        }
        .badge-status-warning {
            background-color: #ffc107;
            color: #212529;
        }
        .badge-status-danger {
            background-color: #dc3545;
        }
        .modal-content {
            border-radius: 8px;
        }
        .btn-action {
            padding: 4px 8px;
            font-size: 12px;
        }
        .footer {
            background-color: #f8f9fa;
            padding: 20px 0;
            margin-top: auto;
        }
        .page-header {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e9ecef;
        }
        .filter-section {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <a class="navbar-brand" href="/">
            <i class="fas fa-bus"></i> 校车管理系统
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/"><i class="fas fa-home"></i> 首页</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown">
                        <i class="fas fa-user-circle"></i> 管理员
                    </a>
                    <div class="dropdown-menu dropdown-menu-right">
                        <a class="dropdown-item" href="#"><i class="fas fa-cog"></i> 设置</a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" href="#"><i class="fas fa-sign-out-alt"></i> 退出</a>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 主体内容 -->
    <div class="container-fluid main-content">
        <div class="row">
            <!-- 侧边栏 -->
            <nav class="col-md-2 d-none d-md-block sidebar">
                <div class="sidebar-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">
                                <i class="fas fa-tachometer-alt"></i> 仪表盘
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.url.path == '/drivers' %}active{% endif %}" href="/drivers">
                                <i class="fas fa-id-card"></i> 司机管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.url.path == '/driver-scores' %}active{% endif %}" href="/driver-scores">
                                <i class="fas fa-star"></i> 司机评分
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.url.path == '/vehicles' %}active{% endif %}" href="/vehicles">
                                <i class="fas fa-bus"></i> 车辆管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.url.path == '/maintenance' %}active{% endif %}" href="/maintenance">
                                <i class="fas fa-tools"></i> 运维记录
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.url.path == '/students' %}active{% endif %}" href="/students">
                                <i class="fas fa-user-graduate"></i> 学生管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.url.path == '/message-logs' %}active{% endif %}" href="/message-logs">
                                <i class="fas fa-envelope"></i> 消息推送
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.url.path == '/bus-status' %}active{% endif %}" href="/bus-status">
                                <i class="fas fa-map-marker-alt"></i> 校车状态
                            </a>
                        </li>
                    </ul>

                    <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted">
                        <span>快捷操作</span>
                    </h6>
                    <ul class="nav flex-column mb-2">
                        <li class="nav-item">
                            <button class="nav-link btn btn-link w-100 text-left" onclick="testSwipeCard()">
                                <i class="fas fa-hand-pointer"></i> 模拟刷卡
                            </button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link btn btn-link w-100 text-left" onclick="testBusStatus()">
                                <i class="fas fa-bell"></i> 模拟状态通知
                            </button>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 主内容区 -->
            <main role="main" class="col-md-9 ml-sm-auto col-lg-10 px-md-4 py-4">
                {% block content %}
                {% endblock %}
            </main>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container text-center text-muted">
            <p class="mb-0">校车管理系统 v1.0 | 基于 FastAPI + Bootstrap 4 开发</p>
        </div>
    </footer>

    <!-- 模态框容器 -->
    <div id="modal-container"></div>

    <!-- jQuery 和 Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- 通用 JavaScript 工具函数 -->
    <script>
        // API 基础 URL
        const API_BASE = window.location.origin;

        // 显示消息提示
        function showMessage(message, type = 'success') {
            const alertClass = type === 'success' ? 'alert-success' : 
                               type === 'error' ? 'alert-danger' : 'alert-info';
            const alertHtml = `
                <div class="alert ${alertClass} alert-dismissible fade show fixed-top" role="alert" style="top: 60px; right: 20px; left: auto; z-index: 9999;">
                    ${message}
                    <button type="button" class="close" data-dismiss="alert">
                        <span>&times;</span>
                    </button>
                </div>
            `;
            $('body').append(alertHtml);
            setTimeout(() => {
                $('.alert').alert('close');
            }, 3000);
        }

        // 确认对话框
        function confirmDelete(message, callback) {
            if (confirm(message)) {
                callback();
            }
        }

        // 格式化日期
        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('zh-CN');
        }

        // 格式化日期时间
        function formatDateTime(dateTimeStr) {
            if (!dateTimeStr) return '-';
            const date = new Date(dateTimeStr);
            return date.toLocaleString('zh-CN');
        }

        // 获取评分颜色类
        function getScoreBadgeClass(score) {
            if (score >= 80) return 'badge-score-high';
            if (score >= 60) return 'badge-score-medium';
            return 'badge-score-low';
        }

        // ============ 表单验证工具函数 ============
        const Validator = {
            phone: function(value) {
                if (!value || value.trim() === '') return { valid: true };
                const phone = value.trim();
                if (!/^1[3-9]\d{9}$/.test(phone)) {
                    return { valid: false, message: '手机号格式不正确，应为11位数字且以1开头' };
                }
                return { valid: true };
            },

            licenseNo: function(value) {
                if (!value || value.trim() === '') return { valid: true };
                const license = value.trim().toUpperCase();
                if (!/^[0-9]{15}$|^[0-9]{17}[0-9X]$/.test(license)) {
                    return { valid: false, message: '驾驶证号格式不正确，应为15位或18位数字（最后一位可为X）' };
                }
                return { valid: true };
            },

            plateNumber: function(value) {
                if (!value || value.trim() === '') {
                    return { valid: false, message: '车牌号不能为空' };
                }
                const plate = value.trim().toUpperCase();
                const chinaPlatePattern = /^[京津沪渝冀豫云辽黑湘皖鲁新苏浙赣鄂桂甘晋蒙陕吉闽贵粤青藏川宁琼][A-Z][A-Z0-9]{5,6}$/;
                if (!chinaPlatePattern.test(plate)) {
                    return { valid: false, message: '车牌号格式不正确，应为：省份简称+字母+5-6位数字/字母，如：京A12345' };
                }
                return { valid: true };
            },

            maxLength: function(value, maxLen) {
                if (!value || value.trim() === '') return { valid: true };
                if (value.length > maxLen) {
                    return { valid: false, message: `长度不能超过${maxLen}个字符` };
                }
                return { valid: true };
            },

            minLength: function(value, minLen) {
                if (!value || value.trim() === '') {
                    return { valid: false, message: `长度不能少于${minLen}个字符` };
                }
                if (value.length < minLen) {
                    return { valid: false, message: `长度不能少于${minLen}个字符` };
                }
                return { valid: true };
            },

            required: function(value, fieldName = '该字段') {
                if (!value || value.trim() === '') {
                    return { valid: false, message: `${fieldName}不能为空` };
                }
                return { valid: true };
            },

            positiveInt: function(value, min = 1, max = 999999) {
                if (value === '' || value === null || value === undefined) return { valid: true };
                const num = parseInt(value);
                if (isNaN(num)) {
                    return { valid: false, message: '请输入有效的数字' };
                }
                if (num < min || num > max) {
                    return { valid: false, message: `请输入${min}-${max}之间的数字` };
                }
                return { valid: true };
            },

            positiveFloat: function(value, min = 0, max = 999999.99) {
                if (value === '' || value === null || value === undefined) return { valid: true };
                const num = parseFloat(value);
                if (isNaN(num)) {
                    return { valid: false, message: '请输入有效的数字' };
                }
                if (num < min || num > max) {
                    return { valid: false, message: `请输入${min}-${max}之间的数字` };
                }
                return { valid: true };
            }
        };

        function showFieldError(element, message) {
            $(element).addClass('is-invalid');
            const formGroup = $(element).closest('.form-group');
            formGroup.find('.invalid-feedback').remove();
            formGroup.append(`<div class="invalid-feedback">${message}</div>`);
        }

        function clearFieldError(element) {
            $(element).removeClass('is-invalid');
            $(element).closest('.form-group').find('.invalid-feedback').remove();
        }

        function validateForm(rules) {
            let isValid = true;
            for (const fieldName in rules) {
                const element = $(`[name="${fieldName}"]`);
                if (element.length === 0) continue;

                const value = element.val();
                const fieldRules = rules[fieldName];

                for (const rule of fieldRules) {
                    let result;
                    switch (rule.type) {
                        case 'required':
                            result = Validator.required(value, rule.label || fieldName);
                            break;
                        case 'phone':
                            result = Validator.phone(value);
                            break;
                        case 'licenseNo':
                            result = Validator.licenseNo(value);
                            break;
                        case 'plateNumber':
                            result = Validator.plateNumber(value);
                            break;
                        case 'maxLength':
                            result = Validator.maxLength(value, rule.max);
                            break;
                        case 'minLength':
                            result = Validator.minLength(value, rule.min);
                            break;
                        case 'positiveInt':
                            result = Validator.positiveInt(value, rule.min || 1, rule.max || 999999);
                            break;
                        case 'positiveFloat':
                            result = Validator.positiveFloat(value, rule.min || 0, rule.max || 999999.99);
                            break;
                        default:
                            continue;
                    }

                    if (!result.valid) {
                        showFieldError(element, result.message);
                        isValid = false;
                        break;
                    } else {
                        clearFieldError(element);
                    }
                }
            }
            return isValid;
        }

        // 为输入框添加实时验证
        function setupRealTimeValidation(rules) {
            for (const fieldName in rules) {
                $(document).on('blur', `[name="${fieldName}"]`, function() {
                    const value = $(this).val();
                    const fieldRules = rules[fieldName];

                    for (const rule of fieldRules) {
                        let result;
                        switch (rule.type) {
                            case 'required':
                                result = Validator.required(value, rule.label || fieldName);
                                break;
                            case 'phone':
                                result = Validator.phone(value);
                                break;
                            case 'licenseNo':
                                result = Validator.licenseNo(value);
                                break;
                            case 'plateNumber':
                                result = Validator.plateNumber(value);
                                break;
                            case 'maxLength':
                                result = Validator.maxLength(value, rule.max);
                                break;
                            case 'minLength':
                                result = Validator.minLength(value, rule.min);
                                break;
                            case 'positiveInt':
                                result = Validator.positiveInt(value, rule.min || 1, rule.max || 999999);
                                break;
                            case 'positiveFloat':
                                result = Validator.positiveFloat(value, rule.min || 0, rule.max || 999999.99);
                                break;
                            default:
                                continue;
                        }

                        if (!result.valid) {
                            showFieldError(this, result.message);
                            break;
                        } else {
                            clearFieldError(this);
                        }
                    }
                });

                $(document).on('input', `[name="${fieldName}"]`, function() {
                    clearFieldError(this);
                });
            }
        }

        // 模拟刷卡测试
        function testSwipeCard() {
            const cardId = prompt('请输入学生卡号 (如: CARD001):', 'CARD001');
            if (!cardId) return;
            
            const swipeType = confirm('点击确定为上车，取消为下车') ? '上车' : '下车';
            
            $.ajax({
                url: `${API_BASE}/api/messages/swipe-card?card_id=${encodeURIComponent(cardId)}&swipe_type=${encodeURIComponent(swipeType)}`,
                method: 'POST',
                success: function(data) {
                    showMessage(`刷卡成功！学生: ${data.student.name}, 类型: ${data.swipe_type}`, 'success');
                },
                error: function(xhr) {
                    const error = xhr.responseJSON ? xhr.responseJSON.detail : '操作失败';
                    showMessage(error, 'error');
                }
            });
        }

        // 模拟校车状态测试
        function testBusStatus() {
            const modalHtml = `
                <div class="modal fade" id="testStatusModal" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">模拟校车状态通知</h5>
                                <button type="button" class="close" data-dismiss="modal">&times;</button>
                            </div>
                            <div class="modal-body">
                                <div class="form-group">
                                    <label>车辆ID</label>
                                    <input type="number" id="testVehicleId" class="form-control" value="1">
                                </div>
                                <div class="form-group">
                                    <label>状态类型</label>
                                    <select id="testStatusType" class="form-control">
                                        <option value="departure">发车</option>
                                        <option value="arrival">到站</option>
                                        <option value="abnormal">异常</option>
                                    </select>
                                </div>
                                <div class="form-group" id="abnormalTypeGroup" style="display:none;">
                                    <label>异常类型</label>
                                    <select id="testAbnormalType" class="form-control">
                                        <option value="绕行">绕行</option>
                                        <option value="迟到">迟到</option>
                                        <option value="临时停车">临时停车</option>
                                        <option value="道路拥堵">道路拥堵</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>位置</label>
                                    <input type="text" id="testLocation" class="form-control" value="学校">
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                                <button type="button" class="btn btn-primary" onclick="submitTestStatus()">提交</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            $('#modal-container').html(modalHtml);
            const modal = $('#testStatusModal');
            modal.modal('show');
            
            $('#testStatusType').change(function() {
                if ($(this).val() === 'abnormal') {
                    $('#abnormalTypeGroup').show();
                } else {
                    $('#abnormalTypeGroup').hide();
                }
            });
        }

        function submitTestStatus() {
            const vehicleId = parseInt($('#testVehicleId').val());
            const statusType = $('#testStatusType').val();
            const location = $('#testLocation').val();
            
            if (isNaN(vehicleId) || vehicleId <= 0) {
                showMessage('请输入有效的车辆ID', 'error');
                return;
            }
            
            let url, params;
            if (statusType === 'abnormal') {
                const abnormalType = $('#testAbnormalType').val();
                url = `${API_BASE}/api/messages/bus-status/abnormal`;
                params = {
                    vehicle_id: vehicleId,
                    abnormal_type: abnormalType,
                    location: location
                };
            } else if (statusType === 'departure') {
                url = `${API_BASE}/api/messages/bus-status/departure`;
                params = { vehicle_id: vehicleId, location: location };
            } else {
                url = `${API_BASE}/api/messages/bus-status/arrival`;
                params = { vehicle_id: vehicleId, location: location };
            }
            
            $.ajax({
                url: url,
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(params),
                success: function(data) {
                    $('#testStatusModal').modal('hide');
                    showMessage(data.message, 'success');
                },
                error: function(xhr) {
                    const error = xhr.responseJSON ? xhr.responseJSON.detail : '操作失败';
                    showMessage(error, 'error');
                }
            });
        }
    </script>

    {% block extra_js %}
    {% endblock %}
</body>
</html>
