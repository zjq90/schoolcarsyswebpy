{% extends "base.html" %}

{% block title %}预警管理{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">
        <i class="fas fa-exclamation-triangle text-primary mr-2"></i>
        预警管理
    </h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <div class="btn-group mr-2">
            <button type="button" class="btn btn-outline-secondary" onclick="refreshAlerts()">
                <i class="fas fa-sync-alt mr-1"></i> 刷新
            </button>
        </div>
    </div>
</div>

<!-- 预警统计卡片 -->
<div class="row mb-4">
    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card border-left-danger shadow h-100 py-2">
            <div class="card-body">
                <div class="row no-gutters align-items-center">
                    <div class="col mr-2">
                        <div class="text-xs font-weight-bold text-danger text-uppercase mb-1">
                            活跃预警
                        </div>
                        <div class="h5 mb-0 font-weight-bold text-gray-800" id="stat-active-alerts">
                            <i class="fas fa-spinner fa-spin"></i>
                        </div>
                    </div>
                    <div class="col-auto">
                        <i class="fas fa-exclamation-circle fa-2x text-gray-300"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card border-left-warning shadow h-100 py-2">
            <div class="card-body">
                <div class="row no-gutters align-items-center">
                    <div class="col mr-2">
                        <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">
                            今日预警
                        </div>
                        <div class="h5 mb-0 font-weight-bold text-gray-800" id="stat-today-alerts">
                            <i class="fas fa-spinner fa-spin"></i>
                        </div>
                    </div>
                    <div class="col-auto">
                        <i class="fas fa-calendar-day fa-2x text-gray-300"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card border-left-success shadow h-100 py-2">
            <div class="card-body">
                <div class="row no-gutters align-items-center">
                    <div class="col mr-2">
                        <div class="text-xs font-weight-bold text-success text-uppercase mb-1">
                            已处理
                        </div>
                        <div class="h5 mb-0 font-weight-bold text-gray-800" id="stat-resolved-alerts">
                            <i class="fas fa-spinner fa-spin"></i>
                        </div>
                    </div>
                    <div class="col-auto">
                        <i class="fas fa-check-circle fa-2x text-gray-300"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card border-left-secondary shadow h-100 py-2">
            <div class="card-body">
                <div class="row no-gutters align-items-center">
                    <div class="col mr-2">
                        <div class="text-xs font-weight-bold text-secondary text-uppercase mb-1">
                            预警总数
                        </div>
                        <div class="h5 mb-0 font-weight-bold text-gray-800" id="stat-total-alerts">
                            <i class="fas fa-spinner fa-spin"></i>
                        </div>
                    </div>
                    <div class="col-auto">
                        <i class="fas fa-list fa-2x text-gray-300"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 筛选条件 -->
<div class="card mb-4">
    <div class="card-body">
        <form class="form-inline">
            <div class="form-group mr-3">
                <label class="mr-2">状态筛选:</label>
                <select class="form-control form-control-sm" id="filter-alert-status">
                    <option value="">全部状态</option>
                    <option value="active">活跃</option>
                    <option value="resolved">已处理</option>
                    <option value="ignored">已忽略</option>
                </select>
            </div>
            <div class="form-group mr-3">
                <label class="mr-2">围栏类型:</label>
                <select class="form-control form-control-sm" id="filter-fence-type">
                    <option value="">全部类型</option>
                    <option value="school">学校区域</option>
                    <option value="danger">危险路段</option>
                    <option value="home">家庭区域</option>
                    <option value="other">其他区域</option>
                </select>
            </div>
            <div class="form-group mr-3">
                <label class="mr-2">严重程度:</label>
                <select class="form-control form-control-sm" id="filter-severity">
                    <option value="">全部</option>
                    <option value="high">高</option>
                    <option value="medium">中</option>
                    <option value="low">低</option>
                </select>
            </div>
            <button type="button" class="btn btn-outline-primary btn-sm" onclick="applyAlertFilters()">
                <i class="fas fa-filter mr-1"></i> 应用筛选
            </button>
        </form>
    </div>
</div>

<!-- 预警列表 -->
<div class="card shadow mb-4">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">
            <i class="fas fa-list mr-2"></i>预警列表
        </h6>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover" id="alerts-table">
                <thead class="thead-light">
                    <tr>
                        <th>ID</th>
                        <th>预警时间</th>
                        <th>围栏名称</th>
                        <th>围栏类型</th>
                        <th>车辆</th>
                        <th>越界位置</th>
                        <th>越界次数</th>
                        <th>严重程度</th>
                        <th>状态</th>
                        <th>处理人</th>
                        <th>处理时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="12" class="text-center text-muted">
                            <i class="fas fa-spinner fa-spin mr-2"></i>加载中...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <!-- 分页 -->
        <nav>
            <ul class="pagination justify-content-center" id="alerts-pagination">
            </ul>
        </nav>
    </div>
</div>

<!-- 处理预警模态框 -->
<div class="modal fade" id="handleAlertModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fas fa-edit text-warning mr-2"></i>处理预警
                </h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <form id="handleAlertForm">
                <input type="hidden" id="handle-alert-id">
                <div class="modal-body">
                    <div class="alert alert-info">
                        <h6 class="alert-heading">预警详情</h6>
                        <div id="alert-detail-info">
                            <!-- 预警详情将通过JS填充 -->
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="handle-status">处理状态 <span class="text-danger">*</span></label>
                        <select class="form-control" id="handle-status" required>
                            <option value="resolved">标记为已处理</option>
                            <option value="ignored">标记为已忽略</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="handle-resolver">处理人 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="handle-resolver" required placeholder="请输入处理人姓名">
                    </div>
                    <div class="form-group">
                        <label for="handle-note">处理备注</label>
                        <textarea class="form-control" id="handle-note" rows="3" placeholder="请输入处理备注..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">
                        <i class="fas fa-times mr-1"></i> 取消
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save mr-1"></i> 确认处理
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 预警详情模态框 -->
<div class="modal fade" id="viewAlertModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fas fa-info-circle text-primary mr-2"></i>预警详情
                </h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div id="view-alert-detail">
                    <!-- 预警详情将通过JS填充 -->
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">
                    <i class="fas fa-times mr-1"></i> 关闭
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/alerts.js"></script>
{% endblock %}
