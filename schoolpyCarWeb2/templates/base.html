<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校车管理系统 - {% block title %}{% endblock %}</title>
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <a class="navbar-brand" href="/">
            <i class="fas fa-bus mr-2"></i>
            校车管理系统
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item" id="nav-dashboard">
                    <a class="nav-link" href="/">
                        <i class="fas fa-tachometer-alt mr-1"></i> 仪表盘
                    </a>
                </li>
                <li class="nav-item" id="nav-vehicles">
                    <a class="nav-link" href="/vehicles">
                        <i class="fas fa-bus mr-1"></i> 车辆管理
                    </a>
                </li>
                <li class="nav-item" id="nav-location">
                    <a class="nav-link" href="/location">
                        <i class="fas fa-map-marker-alt mr-1"></i> 实时定位
                    </a>
                </li>
                <li class="nav-item" id="nav-trajectory">
                    <a class="nav-link" href="/trajectory">
                        <i class="fas fa-route mr-1"></i> 历史轨迹
                    </a>
                </li>
                <li class="nav-item" id="nav-geofence">
                    <a class="nav-link" href="/geofence">
                        <i class="fas fa-map mr-1"></i> 电子围栏
                    </a>
                </li>
                <li class="nav-item" id="nav-alerts">
                    <a class="nav-link" href="/alerts">
                        <i class="fas fa-exclamation-triangle mr-1"></i> 预警管理
                        <span class="badge badge-danger ml-1" id="alert-badge" style="display:none;">0</span>
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown">
                        <i class="fas fa-user-circle mr-1"></i> 管理员
                    </a>
                    <div class="dropdown-menu dropdown-menu-right">
                        <a class="dropdown-item" href="#">
                            <i class="fas fa-user-cog mr-1"></i> 个人设置
                        </a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" href="#">
                            <i class="fas fa-sign-out-alt mr-1"></i> 退出登录
                        </a>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 主内容区域 -->
    <div class="container-fluid mt-4">
        <div class="row">
            <!-- 内容区域 -->
            <main class="col-md-12 ml-sm-auto px-md-4 main-content">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer mt-auto py-3 bg-light fixed-bottom">
        <div class="container text-center">
            <span class="text-muted">
                <i class="fas fa-bus mr-1"></i>
                校车管理系统 v1.0 | 
                <i class="fas fa-clock mr-1"></i>
                <span id="current-time"></span>
            </span>
        </div>
    </footer>

    <!-- jQuery and Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
    <!-- Custom JS -->
    <script src="/static/js/common.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
