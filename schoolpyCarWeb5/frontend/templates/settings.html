<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校车后台管理系统 - 系统设置</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-bus"></i> 校车管理系统</h3>
        </div>
        <div class="sidebar-menu">
            <a href="/"><i class="fas fa-tachometer-alt"></i> 控制台</a>
            <a href="/alarms"><i class="fas fa-exclamation-triangle"></i> 报警管理
                <span id="alarm-badge" class="nav-badge" style="display: none;">0</span>
            </a>
            <a href="/buses"><i class="fas fa-bus"></i> 校车管理</a>
            <a href="/drivers"><i class="fas fa-id-card"></i> 司机管理</a>
            <a href="/students"><i class="fas fa-user-graduate"></i> 学生管理</a>
            <a href="/settings" class="active"><i class="fas fa-cog"></i> 系统设置</a>
            <a href="/test"><i class="fas fa-flask"></i> 测试功能</a>
        </div>
    </div>

    <div class="main-content">
        <div class="navbar-top">
            <div class="d-flex justify-content-between align-items-center">
                <h5><i class="fas fa-cog"></i> 系统设置</h5>
                <div class="d-flex align-items-center">
                    <span class="mr-3"><i class="fas fa-user"></i> 管理员</span>
                    <button class="btn btn-sm btn-outline-secondary">
                        <i class="fas fa-sign-out-alt"></i> 退出
                    </button>
                </div>
            </div>
        </div>

        <!-- 报警级别配置 -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="fas fa-layer-group"></i> 报警级别配置</span>
                <button class="btn btn-sm btn-primary" onclick="loadAlarmLevels()">
                    <i class="fas fa-sync-alt"></i> 刷新
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>级别</th>
                                <th>名称</th>
                                <th>颜色</th>
                                <th>描述</th>
                                <th>响应机制</th>
                            </tr>
                        </thead>
                        <tbody id="level-table-body">
                            <tr><td colspan="5" class="text-center"><div class="loading"></div><br>加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 报警类型配置 -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="fas fa-list"></i> 报警类型配置</span>
                <button class="btn btn-sm btn-primary" onclick="loadAlarmTypes()">
                    <i class="fas fa-sync-alt"></i> 刷新
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>类型名称</th>
                                <th>所属级别</th>
                                <th>触发条件</th>
                                <th>触发方式</th>
                            </tr>
                        </thead>
                        <tbody id="type-table-body">
                            <tr><td colspan="4" class="text-center"><div class="loading"></div><br>加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 系统信息 -->
        <div class="card">
            <div class="card-header">
                <span><i class="fas fa-info-circle"></i> 系统信息</span>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <p><strong>系统名称:</strong> 校车后台管理系统</p>
                        <p><strong>系统版本:</strong> 1.0.0</p>
                        <p><strong>技术栈:</strong> Python + FastAPI + SQLite + Bootstrap V4</p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>开发团队:</strong> 系统开发组</p>
                        <p><strong>最后更新:</strong> 2024年</p>
                        <p><strong>服务状态:</strong> <span class="text-success"><i class="fas fa-check-circle"></i> 正常运行</span></p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="alarm-sound-control">
        <button id="alarm-sound-btn" class="alarm-sound-btn">
            <i class="fas fa-volume-mute"></i>
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>

    <script>
        async function loadAlarmLevels() {
            const tbody = document.getElementById('level-table-body');
            tbody.innerHTML = '<tr><td colspan="5" class="text-center"><div class="loading"></div><br>加载中...</td></tr>';
            
            try {
                const response = await fetch('/api/alarm-levels/');
                const levels = await response.json();
                
                if (levels.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">暂无数据</td></tr>';
                    return;
                }
                
                let html = '';
                levels.forEach(level => {
                    const colorClass = getLevelColorClass(level.color);
                    html += `
                        <tr>
                            <td><span class="badge ${colorClass}">${level.level}级</span></td>
                            <td>${level.name}</td>
                            <td>
                                <span style="display: inline-block; width: 20px; height: 20px; background-color: ${level.color}; border-radius: 3px;"></span>
                                ${level.color}
                            </td>
                            <td>${level.description || '-'}</td>
                            <td>${level.response_mechanism || '-'}</td>
                        </tr>
                    `;
                });
                
                tbody.innerHTML = html;
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger">加载失败</td></tr>';
            }
        }

        async function loadAlarmTypes() {
            const tbody = document.getElementById('type-table-body');
            tbody.innerHTML = '<tr><td colspan="4" class="text-center"><div class="loading"></div><br>加载中...</td></tr>';
            
            try {
                const response = await fetch('/api/alarm-types/');
                const types = await response.json();
                
                if (types.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">暂无数据</td></tr>';
                    return;
                }
                
                // 获取级别信息
                const levelResponse = await fetch('/api/alarm-levels/');
                const levels = await levelResponse.json();
                const levelMap = {};
                levels.forEach(level => {
                    levelMap[level.id] = level.name;
                });
                
                let html = '';
                types.forEach(type => {
                    html += `
                        <tr>
                            <td>${type.name}</td>
                            <td>${levelMap[type.level_id] || type.level_id}</td>
                            <td>${type.trigger_condition || '-'}</td>
                            <td>
                                <span class="badge ${type.is_auto ? 'badge-info' : 'badge-secondary'}">
                                    ${type.is_auto ? '自动触发' : '手动触发'}
                                </span>
                            </td>
                        </tr>
                    `;
                });
                
                tbody.innerHTML = html;
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger">加载失败</td></tr>';
            }
        }

        function getLevelColorClass(color) {
            switch (color) {
                case 'red': return 'badge-danger';
                case 'orange': return 'badge-warning';
                case 'blue': return 'badge-primary';
                default: return 'badge-secondary';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadAlarmLevels();
            loadAlarmTypes();
        });
    </script>
</body>
</html>
