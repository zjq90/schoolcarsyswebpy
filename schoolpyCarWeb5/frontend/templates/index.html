<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校车后台管理系统 - 控制台</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- 侧边栏 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-bus"></i> 校车管理系统</h3>
        </div>
        <div class="sidebar-menu">
            <a href="/" class="active">
                <i class="fas fa-tachometer-alt"></i> 控制台
            </a>
            <a href="/alarms">
                <i class="fas fa-exclamation-triangle"></i> 报警管理
                <span id="alarm-badge" class="nav-badge" style="display: none;">0</span>
            </a>
            <a href="/buses">
                <i class="fas fa-bus"></i> 校车管理
            </a>
            <a href="/drivers">
                <i class="fas fa-id-card"></i> 司机管理
            </a>
            <a href="/students">
                <i class="fas fa-user-graduate"></i> 学生管理
            </a>
            <a href="/settings">
                <i class="fas fa-cog"></i> 系统设置
            </a>
            <a href="/test">
                <i class="fas fa-flask"></i> 测试功能
            </a>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
        <!-- 顶部导航栏 -->
        <div class="navbar-top">
            <div class="d-flex justify-content-between align-items-center">
                <h5><i class="fas fa-tachometer-alt"></i> 控制台</h5>
                <div class="d-flex align-items-center">
                    <span class="mr-3"><i class="fas fa-user"></i> 管理员</span>
                    <button class="btn btn-sm btn-outline-secondary">
                        <i class="fas fa-sign-out-alt"></i> 退出
                    </button>
                </div>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="row">
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="stats-icon primary">
                        <i class="fas fa-bus"></i>
                    </div>
                    <div class="stats-value" id="total-buses">0</div>
                    <div class="stats-label">校车总数</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="stats-icon success">
                        <i class="fas fa-road"></i>
                    </div>
                    <div class="stats-value" id="running-buses">0</div>
                    <div class="stats-label">运行中</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="stats-icon warning">
                        <i class="fas fa-id-card"></i>
                    </div>
                    <div class="stats-value" id="total-drivers">0</div>
                    <div class="stats-label">司机总数</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="stats-icon info">
                        <i class="fas fa-user-graduate"></i>
                    </div>
                    <div class="stats-value" id="total-students">0</div>
                    <div class="stats-label">学生总数</div>
                </div>
            </div>
        </div>

        <!-- 报警统计 -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-chart-bar"></i> 报警统计
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4">
                        <div class="alert alert-danger">
                            <h5><i class="fas fa-exclamation-circle"></i> 待处理报警</h5>
                            <h2 class="mb-0" id="pending-alarms">0</h2>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="alert alert-warning">
                            <h5><i class="fas fa-spinner"></i> 处理中</h5>
                            <h2 class="mb-0" id="processing-alarms">0</h2>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="alert alert-success">
                            <h5><i class="fas fa-check-circle"></i> 已解决</h5>
                            <h2 class="mb-0" id="resolved-alarms">0</h2>
                        </div>
                    </div>
                </div>
                <hr>
                <div class="row">
                    <div class="col-md-4">
                        <div class="d-flex align-items-center">
                            <div style="width: 20px; height: 20px; background-color: #dc3545; margin-right: 10px;"></div>
                            <span>一级报警: <strong id="level1-alarms">0</strong></span>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="d-flex align-items-center">
                            <div style="width: 20px; height: 20px; background-color: #ffc107; margin-right: 10px;"></div>
                            <span>二级报警: <strong id="level2-alarms">0</strong></span>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="d-flex align-items-center">
                            <div style="width: 20px; height: 20px; background-color: #007bff; margin-right: 10px;"></div>
                            <span>三级报警: <strong id="level3-alarms">0</strong></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 快速操作 -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-bolt"></i> 快速操作
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-3">
                        <button class="btn btn-danger btn-block" onclick="testTriggerAlarm(1)">
                            <i class="fas fa-exclamation-triangle"></i><br>
                            触发一级报警
                        </button>
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-warning btn-block" onclick="testTriggerAlarm(4)">
                            <i class="fas fa-exclamation-circle"></i><br>
                            触发二级报警
                        </button>
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-primary btn-block" onclick="testTriggerAlarm(8)">
                            <i class="fas fa-info-circle"></i><br>
                            触发三级报警
                        </button>
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-success btn-block" onclick="generateTestData()">
                            <i class="fas fa-database"></i><br>
                            生成测试数据
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- 报警声音控制按钮 -->
    <div class="alarm-sound-control">
        <button id="alarm-sound-btn" class="alarm-sound-btn">
            <i class="fas fa-volume-mute"></i>
        </button>
    </div>

    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 自定义JS -->
    <script src="/static/js/app.js"></script>

    <script>
        // 测试触发报警
        async function testTriggerAlarm(typeId) {
            try {
                const response = await fetch(`/api/test/trigger-alarm?type_id=${typeId}&bus_id=1`, {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.message) {
                    showToast(data.message, 'success');
                }
            } catch (error) {
                showToast('触发报警失败', 'error');
            }
        }

        // 生成测试数据
        async function generateTestData() {
            try {
                const response = await fetch('/api/test/generate-all', {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.message) {
                    showToast(data.message, 'success');
                    // 重新加载统计数据
                    loadDashboardData();
                }
            } catch (error) {
                showToast('生成测试数据失败', 'error');
            }
        }
    </script>
</body>
</html>
