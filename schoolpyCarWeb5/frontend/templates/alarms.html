<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校车后台管理系统 - 报警管理</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- 侧边栏 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-bus"></i> 校车管理系统</h3>
        </div>
        <div class="sidebar-menu">
            <a href="/">
                <i class="fas fa-tachometer-alt"></i> 控制台
            </a>
            <a href="/alarms" class="active">
                <i class="fas fa-exclamation-triangle"></i> 报警管理
                <span id="alarm-badge" class="nav-badge" style="display: none;">0</span>
            </a>
            <a href="/buses">
                <i class="fas fa-bus"></i> 校车管理
            </a>
            <a href="/drivers">
                <i class="fas fa-id-card"></i> 司机管理
            </a>
            <a href="/students">
                <i class="fas fa-user-graduate"></i> 学生管理
            </a>
            <a href="/settings">
                <i class="fas fa-cog"></i> 系统设置
            </a>
            <a href="/test">
                <i class="fas fa-flask"></i> 测试功能
            </a>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
        <!-- 顶部导航栏 -->
        <div class="navbar-top">
            <div class="d-flex justify-content-between align-items-center">
                <h5><i class="fas fa-exclamation-triangle"></i> 报警管理</h5>
                <div class="d-flex align-items-center">
                    <span class="mr-3"><i class="fas fa-user"></i> 管理员</span>
                    <button class="btn btn-sm btn-outline-secondary">
                        <i class="fas fa-sign-out-alt"></i> 退出
                    </button>
                </div>
            </div>
        </div>

        <!-- 筛选区域 -->
        <div class="card">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-3">
                        <label>报警级别</label>
                        <select id="filter-level" class="form-control">
                            <option value="">全部级别</option>
                            <option value="1">一级报警</option>
                            <option value="2">二级报警</option>
                            <option value="3">三级报警</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label>报警状态</label>
                        <select id="filter-status" class="form-control">
                            <option value="">全部状态</option>
                            <option value="pending">待处理</option>
                            <option value="processing">处理中</option>
                            <option value="resolved">已解决</option>
                            <option value="closed">已关闭</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label>是否已读</label>
                        <select id="filter-read" class="form-control">
                            <option value="">全部</option>
                            <option value="true">已读</option>
                            <option value="false">未读</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label>&nbsp;</label>
                        <div>
                            <button class="btn btn-primary" onclick="loadAlarmList()">
                                <i class="fas fa-search"></i> 查询
                            </button>
                            <button class="btn btn-secondary" onclick="resetFilters()">
                                <i class="fas fa-redo"></i> 重置
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 报警列表 -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="fas fa-list"></i> 报警列表</span>
                <button class="btn btn-sm btn-primary" onclick="loadAlarmList()">
                    <i class="fas fa-sync-alt"></i> 刷新
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>报警编号</th>
                                <th>报警级别</th>
                                <th>报警类型</th>
                                <th>校车牌号</th>
                                <th>位置</th>
                                <th>状态</th>
                                <th>触发时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="alarm-table-body">
                            <tr>
                                <td colspan="8" class="text-center text-muted">
                                    <div class="loading"></div>
                                    <br>加载中...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- 报警声音控制按钮 -->
    <div class="alarm-sound-control">
        <button id="alarm-sound-btn" class="alarm-sound-btn">
            <i class="fas fa-volume-mute"></i>
        </button>
    </div>

    <!-- 报警详情模态框 -->
    <div class="modal fade" id="alarm-detail-modal" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-info-circle"></i> 报警详情</h5>
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>
                <div class="modal-body" id="alarm-detail-content">
                    <!-- 动态加载内容 -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" id="btn-start-process">开始处理</button>
                    <button type="button" class="btn btn-success" id="btn-resolve">标记解决</button>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 自定义JS -->
    <script src="/static/js/app.js"></script>

    <script>
        let currentAlarmId = null;

        // 加载报警列表
        async function loadAlarmList() {
            const tbody = document.getElementById('alarm-table-body');
            tbody.innerHTML = '<tr><td colspan="8" class="text-center"><div class="loading"></div><br>加载中...</td></tr>';
            
            try {
                let url = '/api/alarms/?limit=50';
                
                // 添加筛选条件
                const level = document.getElementById('filter-level').value;
                const status = document.getElementById('filter-status').value;
                const isRead = document.getElementById('filter-read').value;
                
                if (level) url += `&level_id=${level}`;
                if (status) url += `&status=${status}`;
                if (isRead !== '') url += `&is_read=${isRead}`;
                
                const response = await fetch(url);
                const alarms = await response.json();
                
                if (alarms.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">暂无报警数据</td></tr>';
                    return;
                }
                
                let html = '';
                alarms.forEach(alarm => {
                    const levelClass = `alarm-level-${alarm.level_id}`;
                    const statusClass = getStatusClass(alarm.status);
                    const statusText = getStatusText(alarm.status);
                    const levelText = getLevelText(alarm.level_id);
                    
                    html += `
                        <tr class="${levelClass}">
                            <td>${alarm.alarm_number}</td>
                            <td>
                                <span class="badge badge-${getLevelBadgeClass(alarm.level_id)}">${levelText}</span>
                            </td>
                            <td>${alarm.type_id || '-'}</td>
                            <td>${alarm.bus_id || '-'}</td>
                            <td>
                                <i class="fas fa-map-marker-alt text-danger"></i> 
                                ${alarm.location_name || '未知位置'}
                            </td>
                            <td><span class="badge ${statusClass}">${statusText}</span></td>
                            <td>${formatDateTime(alarm.triggered_at)}</td>
                            <td>
                                <button class="btn btn-sm btn-info" onclick="viewAlarmDetail(${alarm.id})">
                                    <i class="fas fa-eye"></i> 详情
                                </button>
                                ${alarm.status === 'pending' ? `
                                    <button class="btn btn-sm btn-primary" onclick="processAlarm(${alarm.id}, 'processing')">
                                        <i class="fas fa-play"></i> 处理
                                    </button>
                                ` : ''}
                                ${alarm.status !== 'resolved' && alarm.status !== 'closed' ? `
                                    <button class="btn btn-sm btn-success" onclick="processAlarm(${alarm.id}, 'resolved')">
                                        <i class="fas fa-check"></i> 解决
                                    </button>
                                ` : ''}
                            </td>
                        </tr>
                    `;
                });
                
                tbody.innerHTML = html;
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center text-danger">加载失败</td></tr>';
                console.error('加载报警列表失败:', error);
            }
        }

        // 获取状态样式类
        function getStatusClass(status) {
            switch (status) {
                case 'pending': return 'badge-pending';
                case 'processing': return 'badge-processing';
                case 'resolved': return 'badge-resolved';
                case 'closed': return 'badge-closed';
                default: return 'badge-secondary';
            }
        }

        // 获取状态文本
        function getStatusText(status) {
            switch (status) {
                case 'pending': return '待处理';
                case 'processing': return '处理中';
                case 'resolved': return '已解决';
                case 'closed': return '已关闭';
                default: return status;
            }
        }

        // 获取级别文本
        function getLevelText(levelId) {
            switch (levelId) {
                case 1: return '一级报警';
                case 2: return '二级报警';
                case 3: return '三级报警';
                default: return '未知';
            }
        }

        // 获取级别徽章样式
        function getLevelBadgeClass(levelId) {
            switch (levelId) {
                case 1: return 'danger';
                case 2: return 'warning';
                case 3: return 'primary';
                default: return 'secondary';
            }
        }

        // 查看报警详情
        async function viewAlarmDetail(alarmId) {
            currentAlarmId = alarmId;
            
            try {
                const response = await fetch(`/api/alarms/${alarmId}`);
                const alarm = await response.json();
                
                const content = document.getElementById('alarm-detail-content');
                content.innerHTML = `
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>报警编号:</strong> ${alarm.alarm_number}</p>
                            <p><strong>报警级别:</strong> ${getLevelText(alarm.level_id)}</p>
                            <p><strong>报警状态:</strong> <span class="badge ${getStatusClass(alarm.status)}">${getStatusText(alarm.status)}</span></p>
                            <p><strong>已读状态:</strong> ${alarm.is_read ? '已读' : '未读'}</p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>校车ID:</strong> ${alarm.bus_id || '-'}</p>
                            <p><strong>司机ID:</strong> ${alarm.driver_id || '-'}</p>
                            <p><strong>触发时间:</strong> ${formatDateTime(alarm.triggered_at)}</p>
                            <p><strong>解决时间:</strong> ${formatDateTime(alarm.resolved_at)}</p>
                        </div>
                    </div>
                    <hr>
                    <div class="row">
                        <div class="col-md-12">
                            <p><strong>位置信息:</strong></p>
                            <p><i class="fas fa-map-marker-alt text-danger"></i> 
                                ${alarm.location_name || '未知位置'}
                                <br>
                                <small>纬度: ${alarm.latitude || '-'}, 经度: ${alarm.longitude || '-'}</small>
                            </p>
                        </div>
                    </div>
                    <hr>
                    <div class="row">
                        <div class="col-md-12">
                            <p><strong>报警描述:</strong></p>
                            <p>${alarm.description || '暂无描述'}</p>
                        </div>
                    </div>
                    ${alarm.remark ? `
                    <hr>
                    <div class="row">
                        <div class="col-md-12">
                            <p><strong>备注:</strong></p>
                            <p>${alarm.remark}</p>
                        </div>
                    </div>
                    ` : ''}
                `;
                
                $('#alarm-detail-modal').modal('show');
            } catch (error) {
                showToast('加载报警详情失败', 'error');
            }
        }

        // 处理报警
        async function processAlarm(alarmId, status) {
            try {
                const response = await fetch(`/api/alarms/${alarmId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: status, is_read: true })
                });
                
                if (response.ok) {
                    showToast('操作成功', 'success');
                    loadAlarmList();
                } else {
                    showToast('操作失败', 'error');
                }
            } catch (error) {
                showToast('操作失败', 'error');
            }
        }

        // 重置筛选
        function resetFilters() {
            document.getElementById('filter-level').value = '';
            document.getElementById('filter-status').value = '';
            document.getElementById('filter-read').value = '';
            loadAlarmList();
        }

        // 页面加载时执行
        document.addEventListener('DOMContentLoaded', function() {
            loadAlarmList();
            
            // 绑定模态框按钮
            document.getElementById('btn-start-process').addEventListener('click', function() {
                if (currentAlarmId) {
                    processAlarm(currentAlarmId, 'processing');
                    $('#alarm-detail-modal').modal('hide');
                }
            });
            
            document.getElementById('btn-resolve').addEventListener('click', function() {
                if (currentAlarmId) {
                    processAlarm(currentAlarmId, 'resolved');
                    $('#alarm-detail-modal').modal('hide');
                }
            });
        });
    </script>
</body>
</html>
