<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校车后台管理系统 - 学生管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-bus"></i> 校车管理系统</h3>
        </div>
        <div class="sidebar-menu">
            <a href="/"><i class="fas fa-tachometer-alt"></i> 控制台</a>
            <a href="/alarms"><i class="fas fa-exclamation-triangle"></i> 报警管理
                <span id="alarm-badge" class="nav-badge" style="display: none;">0</span>
            </a>
            <a href="/buses"><i class="fas fa-bus"></i> 校车管理</a>
            <a href="/drivers"><i class="fas fa-id-card"></i> 司机管理</a>
            <a href="/students" class="active"><i class="fas fa-user-graduate"></i> 学生管理</a>
            <a href="/settings"><i class="fas fa-cog"></i> 系统设置</a>
            <a href="/test"><i class="fas fa-flask"></i> 测试功能</a>
        </div>
    </div>

    <div class="main-content">
        <div class="navbar-top">
            <div class="d-flex justify-content-between align-items-center">
                <h5><i class="fas fa-user-graduate"></i> 学生管理</h5>
                <div class="d-flex align-items-center">
                    <button class="btn btn-sm btn-primary mr-2" onclick="showAddModal()">
                        <i class="fas fa-plus"></i> 新增学生
                    </button>
                    <span class="mr-3"><i class="fas fa-user"></i> 管理员</span>
                    <button class="btn btn-sm btn-outline-secondary">
                        <i class="fas fa-sign-out-alt"></i> 退出
                    </button>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="fas fa-list"></i> 学生列表</span>
                <button class="btn btn-sm btn-primary" onclick="loadStudentList()">
                    <i class="fas fa-sync-alt"></i> 刷新
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>姓名</th>
                                <th>学号</th>
                                <th>班级</th>
                                <th>学校</th>
                                <th>家长姓名</th>
                                <th>家长电话</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="student-table-body">
                            <tr><td colspan="8" class="text-center"><div class="loading"></div><br>加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="alarm-sound-control">
        <button id="alarm-sound-btn" class="alarm-sound-btn">
            <i class="fas fa-volume-mute"></i>
        </button>
    </div>

    <div class="modal fade" id="student-modal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="student-modal-title"><i class="fas fa-plus"></i> 新增学生</h5>
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                </div>
                <div class="modal-body">
                    <form id="student-form">
                        <input type="hidden" id="student-id">
                        <div class="form-group">
                            <label>姓名 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="student-name" placeholder="请输入姓名">
                        </div>
                        <div class="form-group">
                            <label>学号</label>
                            <input type="text" class="form-control" id="student-number" placeholder="请输入学号">
                        </div>
                        <div class="form-group">
                            <label>班级</label>
                            <input type="text" class="form-control" id="student-class" placeholder="请输入班级">
                        </div>
                        <div class="form-group">
                            <label>学校</label>
                            <input type="text" class="form-control" id="student-school" placeholder="请输入学校">
                        </div>
                        <div class="form-group">
                            <label>家长姓名</label>
                            <input type="text" class="form-control" id="parent-name" placeholder="请输入家长姓名">
                        </div>
                        <div class="form-group">
                            <label>家长电话</label>
                            <input type="text" class="form-control" id="parent-phone" placeholder="请输入家长电话">
                        </div>
                        <div class="form-group">
                            <label>状态</label>
                            <select class="form-control" id="student-status">
                                <option value="true">在校</option>
                                <option value="false">离校</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveStudent()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>

    <script>
        async function loadStudentList() {
            const tbody = document.getElementById('student-table-body');
            tbody.innerHTML = '<tr><td colspan="8" class="text-center"><div class="loading"></div><br>加载中...</td></tr>';
            
            try {
                const response = await fetch('/api/students/');
                const students = await response.json();
                
                if (students.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">暂无学生数据</td></tr>';
                    return;
                }
                
                let html = '';
                students.forEach(student => {
                    const statusClass = student.status ? 'badge-success' : 'badge-secondary';
                    const statusText = student.status ? '在校' : '离校';
                    
                    html += `
                        <tr>
                            <td>${student.name}</td>
                            <td>${student.student_number || '-'}</td>
                            <td>${student.class_name || '-'}</td>
                            <td>${student.school || '-'}</td>
                            <td>${student.parent_name || '-'}</td>
                            <td>${student.parent_phone || '-'}</td>
                            <td><span class="badge ${statusClass}">${statusText}</span></td>
                            <td>
                                <button class="btn btn-sm btn-warning" onclick="editStudent(${student.id})">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="deleteStudent(${student.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
                
                tbody.innerHTML = html;
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center text-danger">加载失败</td></tr>';
            }
        }

        function showAddModal() {
            document.getElementById('student-modal-title').innerHTML = '<i class="fas fa-plus"></i> 新增学生';
            document.getElementById('student-id').value = '';
            document.getElementById('student-form').reset();
            $('#student-modal').modal('show');
        }

        async function editStudent(studentId) {
            try {
                const response = await fetch(`/api/students/${studentId}`);
                const student = await response.json();
                
                document.getElementById('student-modal-title').innerHTML = '<i class="fas fa-edit"></i> 编辑学生';
                document.getElementById('student-id').value = student.id;
                document.getElementById('student-name').value = student.name;
                document.getElementById('student-number').value = student.student_number || '';
                document.getElementById('student-class').value = student.class_name || '';
                document.getElementById('student-school').value = student.school || '';
                document.getElementById('parent-name').value = student.parent_name || '';
                document.getElementById('parent-phone').value = student.parent_phone || '';
                document.getElementById('student-status').value = student.status ? 'true' : 'false';
                
                $('#student-modal').modal('show');
            } catch (error) {
                showToast('加载学生信息失败', 'error');
            }
        }

        async function saveStudent() {
            const studentId = document.getElementById('student-id').value;
            const studentData = {
                name: document.getElementById('student-name').value,
                student_number: document.getElementById('student-number').value,
                class_name: document.getElementById('student-class').value,
                school: document.getElementById('student-school').value,
                parent_name: document.getElementById('parent-name').value,
                parent_phone: document.getElementById('parent-phone').value,
                status: document.getElementById('student-status').value === 'true'
            };
            
            try {
                let response;
                if (studentId) {
                    response = await fetch(`/api/students/${studentId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(studentData)
                    });
                } else {
                    response = await fetch('/api/students/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(studentData)
                    });
                }
                
                if (response.ok) {
                    showToast(studentId ? '更新成功' : '新增成功', 'success');
                    $('#student-modal').modal('hide');
                    loadStudentList();
                } else {
                    const error = await response.json();
                    showToast(error.detail || '操作失败', 'error');
                }
            } catch (error) {
                showToast('操作失败', 'error');
            }
        }

        async function deleteStudent(studentId) {
            if (!confirm('确定要删除这位学生吗？')) return;
            
            try {
                const response = await fetch(`/api/students/${studentId}`, { method: 'DELETE' });
                if (response.ok) {
                    showToast('删除成功', 'success');
                    loadStudentList();
                } else {
                    const error = await response.json();
                    showToast(error.detail || '删除失败', 'error');
                }
            } catch (error) {
                showToast('删除失败', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadStudentList();
        });
    </script>
</body>
</html>
