<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校车后台管理系统 - 司机管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-bus"></i> 校车管理系统</h3>
        </div>
        <div class="sidebar-menu">
            <a href="/"><i class="fas fa-tachometer-alt"></i> 控制台</a>
            <a href="/alarms"><i class="fas fa-exclamation-triangle"></i> 报警管理
                <span id="alarm-badge" class="nav-badge" style="display: none;">0</span>
            </a>
            <a href="/buses"><i class="fas fa-bus"></i> 校车管理</a>
            <a href="/drivers" class="active"><i class="fas fa-id-card"></i> 司机管理</a>
            <a href="/students"><i class="fas fa-user-graduate"></i> 学生管理</a>
            <a href="/settings"><i class="fas fa-cog"></i> 系统设置</a>
            <a href="/test"><i class="fas fa-flask"></i> 测试功能</a>
        </div>
    </div>

    <div class="main-content">
        <div class="navbar-top">
            <div class="d-flex justify-content-between align-items-center">
                <h5><i class="fas fa-id-card"></i> 司机管理</h5>
                <div class="d-flex align-items-center">
                    <button class="btn btn-sm btn-primary mr-2" onclick="showAddModal()">
                        <i class="fas fa-plus"></i> 新增司机
                    </button>
                    <span class="mr-3"><i class="fas fa-user"></i> 管理员</span>
                    <button class="btn btn-sm btn-outline-secondary">
                        <i class="fas fa-sign-out-alt"></i> 退出
                    </button>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="fas fa-list"></i> 司机列表</span>
                <button class="btn btn-sm btn-primary" onclick="loadDriverList()">
                    <i class="fas fa-sync-alt"></i> 刷新
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>姓名</th>
                                <th>联系电话</th>
                                <th>身份证号</th>
                                <th>驾驶证号</th>
                                <th>准驾车型</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="driver-table-body">
                            <tr><td colspan="7" class="text-center"><div class="loading"></div><br>加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="alarm-sound-control">
        <button id="alarm-sound-btn" class="alarm-sound-btn">
            <i class="fas fa-volume-mute"></i>
        </button>
    </div>

    <div class="modal fade" id="driver-modal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="driver-modal-title"><i class="fas fa-plus"></i> 新增司机</h5>
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                </div>
                <div class="modal-body">
                    <form id="driver-form">
                        <input type="hidden" id="driver-id">
                        <div class="form-group">
                            <label>姓名 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="driver-name" placeholder="请输入姓名">
                        </div>
                        <div class="form-group">
                            <label>联系电话</label>
                            <input type="text" class="form-control" id="driver-phone" placeholder="请输入联系电话">
                        </div>
                        <div class="form-group">
                            <label>身份证号</label>
                            <input type="text" class="form-control" id="driver-idcard" placeholder="请输入身份证号">
                        </div>
                        <div class="form-group">
                            <label>驾驶证号</label>
                            <input type="text" class="form-control" id="driver-license" placeholder="请输入驾驶证号">
                        </div>
                        <div class="form-group">
                            <label>准驾车型</label>
                            <select class="form-control" id="driver-license-type">
                                <option value="A1">A1</option>
                                <option value="A2">A2</option>
                                <option value="A3">A3</option>
                                <option value="B1">B1</option>
                                <option value="B2">B2</option>
                                <option value="C1">C1</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>状态</label>
                            <select class="form-control" id="driver-status">
                                <option value="true">在岗</option>
                                <option value="false">离岗</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveDriver()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>

    <script>
        async function loadDriverList() {
            const tbody = document.getElementById('driver-table-body');
            tbody.innerHTML = '<tr><td colspan="7" class="text-center"><div class="loading"></div><br>加载中...</td></tr>';
            
            try {
                const response = await fetch('/api/drivers/');
                const drivers = await response.json();
                
                if (drivers.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">暂无司机数据</td></tr>';
                    return;
                }
                
                let html = '';
                drivers.forEach(driver => {
                    const statusClass = driver.status ? 'badge-success' : 'badge-secondary';
                    const statusText = driver.status ? '在岗' : '离岗';
                    
                    html += `
                        <tr>
                            <td>${driver.name}</td>
                            <td>${driver.phone || '-'}</td>
                            <td>${driver.id_card || '-'}</td>
                            <td>${driver.license_number || '-'}</td>
                            <td>${driver.license_type || '-'}</td>
                            <td><span class="badge ${statusClass}">${statusText}</span></td>
                            <td>
                                <button class="btn btn-sm btn-warning" onclick="editDriver(${driver.id})">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="deleteDriver(${driver.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
                
                tbody.innerHTML = html;
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger">加载失败</td></tr>';
            }
        }

        function showAddModal() {
            document.getElementById('driver-modal-title').innerHTML = '<i class="fas fa-plus"></i> 新增司机';
            document.getElementById('driver-id').value = '';
            document.getElementById('driver-form').reset();
            $('#driver-modal').modal('show');
        }

        async function editDriver(driverId) {
            try {
                const response = await fetch(`/api/drivers/${driverId}`);
                const driver = await response.json();
                
                document.getElementById('driver-modal-title').innerHTML = '<i class="fas fa-edit"></i> 编辑司机';
                document.getElementById('driver-id').value = driver.id;
                document.getElementById('driver-name').value = driver.name;
                document.getElementById('driver-phone').value = driver.phone || '';
                document.getElementById('driver-idcard').value = driver.id_card || '';
                document.getElementById('driver-license').value = driver.license_number || '';
                document.getElementById('driver-license-type').value = driver.license_type || 'A1';
                document.getElementById('driver-status').value = driver.status ? 'true' : 'false';
                
                $('#driver-modal').modal('show');
            } catch (error) {
                showToast('加载司机信息失败', 'error');
            }
        }

        async function saveDriver() {
            const driverId = document.getElementById('driver-id').value;
            const driverData = {
                name: document.getElementById('driver-name').value,
                phone: document.getElementById('driver-phone').value,
                id_card: document.getElementById('driver-idcard').value,
                license_number: document.getElementById('driver-license').value,
                license_type: document.getElementById('driver-license-type').value,
                status: document.getElementById('driver-status').value === 'true'
            };
            
            try {
                let response;
                if (driverId) {
                    response = await fetch(`/api/drivers/${driverId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(driverData)
                    });
                } else {
                    response = await fetch('/api/drivers/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(driverData)
                    });
                }
                
                if (response.ok) {
                    showToast(driverId ? '更新成功' : '新增成功', 'success');
                    $('#driver-modal').modal('hide');
                    loadDriverList();
                } else {
                    const error = await response.json();
                    showToast(error.detail || '操作失败', 'error');
                }
            } catch (error) {
                showToast('操作失败', 'error');
            }
        }

        async function deleteDriver(driverId) {
            if (!confirm('确定要删除这位司机吗？')) return;
            
            try {
                const response = await fetch(`/api/drivers/${driverId}`, { method: 'DELETE' });
                if (response.ok) {
                    showToast('删除成功', 'success');
                    loadDriverList();
                } else {
                    const error = await response.json();
                    showToast(error.detail || '删除失败', 'error');
                }
            } catch (error) {
                showToast('删除失败', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadDriverList();
        });
    </script>
</body>
</html>
