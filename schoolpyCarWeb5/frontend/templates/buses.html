<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校车后台管理系统 - 校车管理</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- 侧边栏 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-bus"></i> 校车管理系统</h3>
        </div>
        <div class="sidebar-menu">
            <a href="/">
                <i class="fas fa-tachometer-alt"></i> 控制台
            </a>
            <a href="/alarms">
                <i class="fas fa-exclamation-triangle"></i> 报警管理
                <span id="alarm-badge" class="nav-badge" style="display: none;">0</span>
            </a>
            <a href="/buses" class="active">
                <i class="fas fa-bus"></i> 校车管理
            </a>
            <a href="/drivers">
                <i class="fas fa-id-card"></i> 司机管理
            </a>
            <a href="/students">
                <i class="fas fa-user-graduate"></i> 学生管理
            </a>
            <a href="/settings">
                <i class="fas fa-cog"></i> 系统设置
            </a>
            <a href="/test">
                <i class="fas fa-flask"></i> 测试功能
            </a>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
        <!-- 顶部导航栏 -->
        <div class="navbar-top">
            <div class="d-flex justify-content-between align-items-center">
                <h5><i class="fas fa-bus"></i> 校车管理</h5>
                <div class="d-flex align-items-center">
                    <button class="btn btn-sm btn-primary mr-2" onclick="showAddModal()">
                        <i class="fas fa-plus"></i> 新增校车
                    </button>
                    <span class="mr-3"><i class="fas fa-user"></i> 管理员</span>
                    <button class="btn btn-sm btn-outline-secondary">
                        <i class="fas fa-sign-out-alt"></i> 退出
                    </button>
                </div>
            </div>
        </div>

        <!-- 校车列表 -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="fas fa-list"></i> 校车列表</span>
                <button class="btn btn-sm btn-primary" onclick="loadBusList()">
                    <i class="fas fa-sync-alt"></i> 刷新
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>校车牌号</th>
                                <th>车牌号</th>
                                <th>车型</th>
                                <th>核载人数</th>
                                <th>状态</th>
                                <th>当前位置</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="bus-table-body">
                            <tr>
                                <td colspan="7" class="text-center text-muted">
                                    <div class="loading"></div>
                                    <br>加载中...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- 报警声音控制按钮 -->
    <div class="alarm-sound-control">
        <button id="alarm-sound-btn" class="alarm-sound-btn">
            <i class="fas fa-volume-mute"></i>
        </button>
    </div>

    <!-- 新增/编辑校车模态框 -->
    <div class="modal fade" id="bus-modal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="bus-modal-title"><i class="fas fa-plus"></i> 新增校车</h5>
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="bus-form">
                        <input type="hidden" id="bus-id">
                        <div class="form-group">
                            <label>校车牌号 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="bus-number" placeholder="请输入校车牌号">
                        </div>
                        <div class="form-group">
                            <label>车牌号 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="plate-number" placeholder="请输入车牌号">
                        </div>
                        <div class="form-group">
                            <label>车型</label>
                            <input type="text" class="form-control" id="bus-model" placeholder="请输入车型">
                        </div>
                        <div class="form-group">
                            <label>核载人数</label>
                            <input type="number" class="form-control" id="capacity" placeholder="请输入核载人数" value="40">
                        </div>
                        <div class="form-group">
                            <label>状态</label>
                            <select class="form-control" id="bus-status">
                                <option value="idle">空闲</option>
                                <option value="running">运行中</option>
                                <option value="maintenance">维护中</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveBus()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 自定义JS -->
    <script src="/static/js/app.js"></script>

    <script>
        // 加载校车列表
        async function loadBusList() {
            const tbody = document.getElementById('bus-table-body');
            tbody.innerHTML = '<tr><td colspan="7" class="text-center"><div class="loading"></div><br>加载中...</td></tr>';
            
            try {
                const response = await fetch('/api/buses/');
                const buses = await response.json();
                
                if (buses.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">暂无校车数据</td></tr>';
                    return;
                }
                
                let html = '';
                buses.forEach(bus => {
                    const statusClass = getStatusClass(bus.status);
                    const statusText = getStatusText(bus.status);
                    
                    html += `
                        <tr>
                            <td>${bus.bus_number}</td>
                            <td>${bus.plate_number}</td>
                            <td>${bus.model || '-'}</td>
                            <td>${bus.capacity} 人</td>
                            <td><span class="badge ${statusClass}">${statusText}</span></td>
                            <td>
                                ${bus.current_latitude && bus.current_longitude ? 
                                    `<i class="fas fa-map-marker-alt text-danger"></i> ${bus.current_latitude.toFixed(4)}, ${bus.current_longitude.toFixed(4)}` : 
                                    '-'
                                }
                            </td>
                            <td>
                                <button class="btn btn-sm btn-info" onclick="viewBusDetail(${bus.id})">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button class="btn btn-sm btn-warning" onclick="editBus(${bus.id})">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="deleteBus(${bus.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
                
                tbody.innerHTML = html;
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger">加载失败</td></tr>';
                console.error('加载校车列表失败:', error);
            }
        }

        // 获取状态样式类
        function getStatusClass(status) {
            switch (status) {
                case 'idle': return 'badge-secondary';
                case 'running': return 'badge-success';
                case 'maintenance': return 'badge-warning';
                default: return 'badge-secondary';
            }
        }

        // 获取状态文本
        function getStatusText(status) {
            switch (status) {
                case 'idle': return '空闲';
                case 'running': return '运行中';
                case 'maintenance': return '维护中';
                default: return status;
            }
        }

        // 显示新增模态框
        function showAddModal() {
            document.getElementById('bus-modal-title').innerHTML = '<i class="fas fa-plus"></i> 新增校车';
            document.getElementById('bus-id').value = '';
            document.getElementById('bus-form').reset();
            $('#bus-modal').modal('show');
        }

        // 编辑校车
        async function editBus(busId) {
            try {
                const response = await fetch(`/api/buses/${busId}`);
                const bus = await response.json();
                
                document.getElementById('bus-modal-title').innerHTML = '<i class="fas fa-edit"></i> 编辑校车';
                document.getElementById('bus-id').value = bus.id;
                document.getElementById('bus-number').value = bus.bus_number;
                document.getElementById('plate-number').value = bus.plate_number;
                document.getElementById('bus-model').value = bus.model || '';
                document.getElementById('capacity').value = bus.capacity;
                document.getElementById('bus-status').value = bus.status;
                
                $('#bus-modal').modal('show');
            } catch (error) {
                showToast('加载校车信息失败', 'error');
            }
        }

        // 查看校车详情
        async function viewBusDetail(busId) {
            showToast('详情功能开发中', 'info');
        }

        // 保存校车
        async function saveBus() {
            const busId = document.getElementById('bus-id').value;
            const busData = {
                bus_number: document.getElementById('bus-number').value,
                plate_number: document.getElementById('plate-number').value,
                model: document.getElementById('bus-model').value,
                capacity: parseInt(document.getElementById('capacity').value) || 40,
                status: document.getElementById('bus-status').value
            };
            
            try {
                let response;
                if (busId) {
                    // 更新
                    response = await fetch(`/api/buses/${busId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(busData)
                    });
                } else {
                    // 新增
                    response = await fetch('/api/buses/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(busData)
                    });
                }
                
                if (response.ok) {
                    showToast(busId ? '更新成功' : '新增成功', 'success');
                    $('#bus-modal').modal('hide');
                    loadBusList();
                } else {
                    const error = await response.json();
                    showToast(error.detail || '操作失败', 'error');
                }
            } catch (error) {
                showToast('操作失败', 'error');
            }
        }

        // 删除校车
        async function deleteBus(busId) {
            if (!confirm('确定要删除这辆校车吗？')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/buses/${busId}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    showToast('删除成功', 'success');
                    loadBusList();
                } else {
                    const error = await response.json();
                    showToast(error.detail || '删除失败', 'error');
                }
            } catch (error) {
                showToast('删除失败', 'error');
            }
        }

        // 页面加载时执行
        document.addEventListener('DOMContentLoaded', function() {
            loadBusList();
        });
    </script>
</body>
</html>
